name: Build, validate and release GTFS

# Rebuilds gtfs.zip from src/, validates it with the MobilityData GTFS
# validator and publishes it on the rolling release "latest":
#   https://github.com/ColombiaTransit/gtfs-bogota-auto-servicio-chia/releases/download/latest/gtfs.zip
# The OpenTripPlanner pipeline (ColombiaTransit/otp-docker) reads it from there.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/release.yml"
  schedule:
    # Monthly check on the 1st, 05:00 UTC: re-validates the feed so an
    # approaching end date (calendar.txt) shows up as a failed run.
    - cron: "0 5 1 * *"
  workflow_dispatch: {}

concurrency:
  group: gtfs-release
  cancel-in-progress: false

permissions:
  contents: write   # publish/update the release

env:
  RELEASE_TAG: latest
  GTFS_VALIDATOR_VERSION: latest   # or pin, e.g. v8.0.1
  MIN_DAYS_VALID: "30"             # fail when service ends sooner than this

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build feed
        run: python3 src/build.py

      - name: Check committed gtfs/ matches src/
        run: |
          if ! git diff --quiet -- gtfs/; then
            echo "::warning::gtfs/ in the repository is out of date with src/. The release uses the freshly built feed; run 'python3 src/build.py' and commit gtfs/ to keep them in sync."
            git diff --stat -- gtfs/
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Download gtfs-validator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GTFS_VALIDATOR_VERSION}" = "latest" ]; then
            URL=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              https://api.github.com/repos/MobilityData/gtfs-validator/releases/latest \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(next(a['browser_download_url'] for a in d['assets'] if a['name'].endswith('-cli.jar')))")
          else
            URL="https://github.com/MobilityData/gtfs-validator/releases/download/${GTFS_VALIDATOR_VERSION}/gtfs-validator-cli.jar"
          fi
          curl -fsSL -o gtfs-validator-cli.jar "$URL"

      - name: Validate
        run: |
          java -Xmx2g -jar gtfs-validator-cli.jar -i gtfs.zip -o validation-report -c co -svu

      - name: Check validation result
        run: |
          python3 - <<'EOF'
          import datetime as dt, json, os, sys
          r = json.load(open("validation-report/report.json"))
          errors = {n["code"]: n["totalNotices"] for n in r["notices"] if n["severity"] == "ERROR"}
          warnings = sum(n["totalNotices"] for n in r["notices"] if n["severity"] == "WARNING")
          end = (r["summary"].get("feedInfo") or {}).get("feedServiceWindowEnd")
          today = dt.datetime.now(dt.timezone(dt.timedelta(hours=-5))).date()
          min_days = int(os.environ["MIN_DAYS_VALID"])
          lines = [f"Errors: {sum(errors.values())}", f"Warnings: {warnings}", f"Service until: {end}"]
          print("\n".join(lines))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### GTFS validation\n\n" + "\n".join(f"- {l}" for l in lines) + "\n")
          ok = True
          if errors:
              print(f"::error::Validation errors: {errors}")
              ok = False
          if not end or dt.date.fromisoformat(end) < today + dt.timedelta(days=min_days):
              print(f"::error::Service ends {end}; update calendar.txt dates in src/build.py "
                    f"(needs at least {min_days} days from today)")
              ok = False
          sys.exit(0 if ok else 1)
          EOF

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: validation-report
          path: validation-report/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Latest GTFS feed
          make_latest: true
          body: |
            GTFS feed for Auto Servicio Chía, built from commit `${{ github.sha }}`
            and validated with the MobilityData GTFS validator (see `report.html`).

            Stable download URL:
            https://github.com/${{ github.repository }}/releases/download/latest/gtfs.zip

            This release is updated in place on every run.
          files: |
            gtfs.zip
            validation-report/report.json
            validation-report/report.html
